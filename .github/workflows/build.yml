name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get source files
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install -r requirements-build.txt

      - name: Build app, installer, and update ZIP
        shell: pwsh
        run: .\build_release.ps1

      - name: Save installer and update ZIP
        uses: actions/upload-artifact@v7
        with:
          name: JindoWidget-Windows
          path: |
            release/JindoWidget-Setup-*.exe
            release/UsagiJindo-v*-Windows-x64.zip
          if-no-files-found: error
