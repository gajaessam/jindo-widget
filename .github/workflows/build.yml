name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get source files
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install -r requirements-build.txt

      - name: Build app and installer
        shell: pwsh
        run: .\build_release.ps1

      - name: Save installer
        uses: actions/upload-artifact@v7
        with:
          name: JindoWidget-Windows
          path: release/JindoWidget-Setup-v*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = python -c "from update_config import APP_VERSION; print(APP_VERSION)"
          if ($LASTEXITCODE -ne 0) { throw "Could not read APP_VERSION from update_config.py." }
          $version = $version.Trim()
          $tag = "v$version"
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "APP_VERSION must use X.Y.Z format." }

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists. Skipping publication."
            exit 0
          }

          $installer = Join-Path "release" "JindoWidget-Setup-v${version}.exe"
          if (!(Test-Path -LiteralPath $installer)) { throw "Installer not found: $installer" }

          gh release create $tag $installer `
            --repo $env:GITHUB_REPOSITORY `
            --title "진도 위젯 $tag" `
            --notes "진도 위젯 $tag 설치 파일" `
            --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed for $tag." }
